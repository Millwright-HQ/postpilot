<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PostPilot · Log in</title>
<style>
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:#0f1115; color:#e8eaf0; font:14px system-ui, sans-serif; }
  form { background:#181b22; border:1px solid #2a2f3a; border-radius:12px; padding:24px; width:min(320px,90vw); }
  h1 { font-size:18px; margin:0 0 16px; }
  input { width:100%; box-sizing:border-box; background:#0f1115; color:inherit; border:1px solid #2a2f3a; border-radius:8px; padding:10px; font:inherit; }
  button { width:100%; margin-top:12px; background:#7c5cff; color:#fff; border:0; border-radius:8px; padding:10px; font:inherit; cursor:pointer; }
  .err { color:#ff5d5d; margin-top:8px; min-height:1em; }
</style>
</head>
<body>
<form id="f">
  <h1>✈️ PostPilot</h1>
  <input type="password" id="pw" placeholder="Password" autofocus required>
  <button>Log in</button>
  <div class="err" id="err"></div>
</form>
<script>
document.getElementById('f').onsubmit = async (e) => {
  e.preventDefault();
  const r = await fetch('/api/login', { method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ password: document.getElementById('pw').value }) });
  if (r.ok) location.href = '/'; else document.getElementById('err').textContent = (await r.json()).error;
};
</script>
</body>
</html>
